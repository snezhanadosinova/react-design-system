services:
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile

    ports:
      - "5173:5173"
      - "6006:6006"

    volumes:
      - .:/app
      - /app/node_modules
      - gh-config:/root/.config/gh

    stdin_open: true
    tty: true

volumes:
  gh-config:
